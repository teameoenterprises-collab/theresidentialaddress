<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Referral — James Baker &amp; Associates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,400;1,6..96,500&family=Public+Sans:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0e2a52; --navy2: #163c74; --navy3: #081b36; --navy4: #051025;
      --blue-mist: #4f7dc2;
      --gold: #ad8b3c; --gold2: #cba956; --gold3: #e8cd8a;
      --white: #fbfaf6; --offwhite: #f2f3f7; --offwhite2: #e9ecf2; --offwhite3: #d9e0ea;
      --ink: #0c1626; --muted: #5c6b83;
      --line: rgba(14,42,82,0.14);
      --shadow: 0 22px 50px -22px rgba(9,27,54,0.35);
      --ease: cubic-bezier(.22,.68,.2,1);
      --font-display: 'Bodoni Moda', serif;
      --font-body: 'Public Sans', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body); background: var(--offwhite); color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 1.5rem; }

    /* soft royal texture: faint gold dot lattice */
    .texture {
      background-image: radial-gradient(circle at 1px 1px, rgba(173,139,60,0.16) 1px, transparent 0);
      background-size: 24px 24px;
    }
    .texture-dark {
      background-image: radial-gradient(circle at 1px 1px, rgba(232,205,138,0.14) 1px, transparent 0);
      background-size: 24px 24px;
    }

    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--gold); font-weight: 500;
    }
    .eyebrow::before {
      content: ''; width: 16px; height: 1px; background: var(--gold); display: inline-block;
    }
    .light .eyebrow { color: var(--gold3); }
    .light .eyebrow::before { background: var(--gold3); }

    h1, h2, h3 { font-family: var(--font-display); font-weight: 600; }
    .reveal { opacity: 0; transform: translateY(22px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
    .reveal.in { opacity: 1; transform: translateY(0); }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
      html { scroll-behavior: auto; }
    }

    /* ---------- NAV ---------- */
    .nav {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 1.5rem; background: rgba(246,248,252,0.72);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid transparent; transition: border-color .3s, background .3s, padding .3s;
    }
    .nav.scrolled { border-color: var(--line); background: rgba(246,248,252,0.94); padding: 12px 1.5rem; }
    .nav-brand { display: flex; align-items: center; }
    .nav-brand img { height: 34px; width: auto; display: block; transition: height .3s; }
    .nav.scrolled .nav-brand img { height: 28px; }
    .nav-right { display: flex; align-items: center; gap: 22px; }
    .nav-email {
      display: flex; align-items: center; gap: 7px;
      font-family: var(--font-mono); font-size: 12.5px; color: var(--navy2);
      text-decoration: none; letter-spacing: 0.01em;
    }
    .nav-email svg { width: 14px; height: 14px; flex-shrink: 0; }
    .nav-email:hover { color: var(--gold); }
    @media (max-width: 640px) { .nav-email span { display: none; } }
    .nav-cta {
      font-family: var(--font-body); font-size: 13.5px; font-weight: 600; padding: 10px 20px; border-radius: 100px;
      background: var(--navy); color: var(--white); text-decoration: none;
      transition: background .2s, transform .2s;
    }
    .nav-cta:hover { background: var(--navy2); transform: translateY(-1px); }

    /* ---------- HERO ---------- */
    .hero {
      position: relative; overflow: hidden;
      background: radial-gradient(ellipse 120% 90% at 20% -10%, var(--navy2) 0%, var(--navy) 45%, var(--navy4) 100%);
      color: var(--white); padding: 4rem 0 0;
    }
    .hero::before, .hero::after {
      content: ''; position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.28; pointer-events: none;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .hero::before { width: 440px; height: 440px; background: var(--gold3); top: -160px; right: -80px; }
    .hero::after { width: 340px; height: 340px; background: var(--blue-mist); bottom: -160px; left: 6%; animation-delay: -7s; }
    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(-30px, 40px) scale(1.12); }
    }
    @media (prefers-reduced-motion: reduce) { .hero::before, .hero::after { animation: none; } }

    .hero-grid {
      position: relative; z-index: 1; display: grid; grid-template-columns: 1.05fr 0.95fr;
      gap: 2.5rem; align-items: end;
    }
    .hero-copy { padding-bottom: 4rem; }
    .hero-copy h1 {
      font-size: 45px; line-height: 1.14; margin: 18px 0 16px; color: var(--white);
    }
    .hero-copy h1 em { font-style: italic; color: var(--gold3); }
    .hero-copy p.lead { color: rgba(255,255,255,0.78); font-size: 16.5px; line-height: 1.6; max-width: 46ch; margin-bottom: 28px; }

    .hero-actions { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 36px; }
    .ref-cta {
      display: inline-flex; align-items: center; gap: 10px;
      background: linear-gradient(135deg, var(--gold2), var(--gold)); color: var(--navy4);
      padding: 15px 30px; border-radius: 10px; font-weight: 700; font-size: 15px;
      text-decoration: none; box-shadow: 0 14px 30px -10px rgba(173,139,60,0.55);
      transition: transform .25s var(--ease), box-shadow .25s var(--ease);
    }
    .ref-cta:hover { transform: translateY(-2px); box-shadow: 0 18px 36px -8px rgba(173,139,60,0.65); }
    .ref-cta .arrow { transition: transform .25s var(--ease); }
    .ref-cta:hover .arrow { transform: translateX(4px); }
    .hero-tel { font-size: 14px; color: rgba(255,255,255,0.75); text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 2px; }
    .hero-tel:hover { color: var(--white); border-color: var(--white); }

    .hero-stats { display: flex; gap: 34px; flex-wrap: wrap; }
    .hero-stats div { min-width: 90px; }
    .hero-stats strong { display: block; font-family: var(--font-display); font-size: 30px; color: var(--gold3); font-weight: 500; }
    .hero-stats span { font-family: var(--font-mono); font-size: 11px; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: .06em; }

    /* hero photo + seal */
    .hero-photo-col { position: relative; display: flex; justify-content: center; align-items: flex-end; height: 100%; }
    .hero-photo-glow {
      position: absolute; width: 380px; height: 380px; border-radius: 50%;
      background: radial-gradient(circle, rgba(203,169,86,0.35), transparent 68%);
      bottom: 20px;
    }
    .hero-photo-wrap { position: relative; z-index: 1; }
    .hero-photo-wrap img { max-height: 460px; width: auto; margin: 0 auto; filter: drop-shadow(0 30px 40px rgba(5,16,37,0.45)); }

    .seal {
      position: absolute; left: -18px; bottom: 60px; z-index: 2;
      width: 128px; height: 128px; border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, var(--gold3), var(--gold) 60%, var(--gold) 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 18px 36px -12px rgba(0,0,0,0.5);
      animation: sealIn .9s var(--ease) both;
    }
    @keyframes sealIn { from { opacity: 0; transform: scale(.6) rotate(-18deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
    .seal::before {
      content: ''; position: absolute; inset: 8px; border-radius: 50%;
      border: 1.5px dashed rgba(8,27,54,0.4);
    }
    .seal-inner { text-align: center; color: var(--navy4); }
    .seal-inner img.plogo { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; margin: 0 auto 5px; border: 2px solid rgba(8,27,54,0.25); }
    .seal-initial {
      width: 36px; height: 36px; border-radius: 50%; margin: 0 auto 5px;
      background: var(--navy4); color: var(--gold3); font-family: var(--font-display);
      display: flex; align-items: center; justify-content: center; font-size: 16px;
    }
    .seal-inner b { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
    .seal-inner small { display: block; font-family: var(--font-mono); font-size: 9px; letter-spacing: .06em; text-transform: uppercase; opacity: .75; margin-top: 2px; max-width: 84px; overflow-wrap: break-word; }

    .hero-panel-row { position: relative; z-index: 1; border-top: 1px solid rgba(255,255,255,0.14); padding: 26px 0; }
    .hero-panel-row ul { list-style: none; display: flex; flex-wrap: wrap; gap: 22px 32px; }
    .hero-panel-row li { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: rgba(255,255,255,0.85); }
    .check { width: 16px; height: 16px; border-radius: 50%; background: var(--gold); flex-shrink: 0; position: relative; }
    .check::after { content: ''; position: absolute; left: 5px; top: 3px; width: 4px; height: 7px; border: solid var(--navy4); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }

    /* ---------- STEPS ---------- */
    .section { padding: 5rem 0; }
    .section-head { max-width: 620px; margin: 0 auto 3rem; text-align: center; }
    .section-head h2 { font-size: 33px; color: var(--navy3); margin-top: 12px; line-height: 1.2; }
    .section-head p { color: var(--muted); font-size: 15.5px; margin-top: 12px; line-height: 1.6; }
    .center { text-align: center; }

    .ref-steps {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;
      max-width: 900px; margin: 0 auto; position: relative;
    }
    .ref-steps::before {
      content: ''; position: absolute; top: 20px; left: 15%; right: 15%; height: 1px;
      background: repeating-linear-gradient(90deg, var(--gold) 0 6px, transparent 6px 12px);
    }
    .ref-steps div { text-align: center; position: relative; padding: 0 12px; }
    .ref-num {
      width: 40px; height: 40px; border-radius: 50%; background: var(--white); border: 1.5px solid var(--gold);
      color: var(--gold); display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px; font-weight: 600; font-size: 15px; font-family: var(--font-display);
      position: relative; z-index: 1;
    }
    .ref-steps strong { font-size: 16px; display: block; margin-bottom: 6px; color: var(--navy3); font-family: var(--font-body); font-weight: 700; }
    .ref-steps small { font-size: 13.5px; color: var(--muted); line-height: 1.5; }

    /* ---------- TRUST BAR ---------- */
    .trust-bar { background: var(--navy3); color: var(--white); padding: 2.6rem 0; }
    .trust-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; text-align: center; }
    .trust-grid strong { display: block; font-family: var(--font-display); font-size: 36px; color: var(--gold3); font-weight: 500; }
    .trust-grid span { font-family: var(--font-mono); font-size: 11.5px; color: rgba(255,255,255,0.65); text-transform: uppercase; letter-spacing: .06em; }

    /* ---------- COMPARISON ---------- */
    .compare {
      background: var(--white); border: 1px solid var(--offwhite3); border-radius: 18px; overflow: hidden;
      max-width: 760px; margin: 0 auto; box-shadow: var(--shadow); position: relative;
      background-image: linear-gradient(to right,
        transparent 0%, transparent 42.9%,
        rgba(173,139,60,0.09) 42.9%, rgba(173,139,60,0.09) 71.4%,
        transparent 71.4%, transparent 100%);
    }
    .compare::before {
      content: ''; position: absolute; inset: 6px; border: 1px solid rgba(173,139,60,0.35); border-radius: 13px; pointer-events: none;
    }
    .compare-row { display: grid; grid-template-columns: 1.5fr 1fr 1fr; align-items: center; padding: 16px 26px; border-bottom: 1px solid var(--offwhite2); font-size: 14.5px; transition: background .2s; }
    .compare-row:last-child { border-bottom: none; }
    .compare-row:not(.head):hover { background: rgba(173,139,60,0.06); }
    .compare-row:not(.head):nth-child(even) { background: rgba(14,42,82,0.025); }
    .compare-row.head {
      background: linear-gradient(120deg, var(--navy), var(--navy2)); font-weight: 700; font-family: var(--font-mono);
      font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: rgba(255,255,255,0.9);
    }
    .compare-row.head span:nth-child(2) { color: var(--gold3); display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .tag-recommended {
      font-family: var(--font-mono); font-size: 9px; letter-spacing: .06em; text-transform: uppercase;
      background: var(--gold); color: var(--navy4); padding: 2px 8px; border-radius: 100px; font-weight: 600;
    }
    .compare-row span.yes, .compare-row span.no { justify-self: center; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .compare-row span.yes { background: var(--navy); box-shadow: 0 4px 10px -3px rgba(14,42,82,0.5); }
    .compare-row span.yes svg { width: 14px; height: 14px; stroke: var(--gold3); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .compare-row span.no { background: var(--offwhite2); border: 1px solid var(--offwhite3); }
    .compare-row span.no svg { width: 11px; height: 11px; stroke: var(--muted); stroke-width: 3; stroke-linecap: round; fill: none; }

    /* ---------- SERVICES ---------- */
    .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
    .svc-card {
      background: var(--white); border: 1px solid var(--offwhite3); border-radius: 16px; padding: 28px 24px;
      transition: transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s;
    }
    .svc-card:hover { transform: translateY(-5px); box-shadow: var(--shadow); border-color: var(--gold); }
    .svc-icon {
      width: 44px; height: 44px; border-radius: 12px; background: var(--navy);
      display: flex; align-items: center; justify-content: center; margin-bottom: 16px;
      color: var(--gold3); font-family: var(--font-mono); font-size: 13px; font-weight: 500;
    }
    .svc-card h3 { font-size: 19px; color: var(--navy3); margin-bottom: 8px; font-weight: 600; font-family: var(--font-body); }
    .svc-card p { font-size: 14px; color: var(--muted); line-height: 1.55; }

    /* ---------- PROCESS ---------- */
    .process { max-width: 760px; margin: 0 auto; position: relative; }
    .process::before { content: ''; position: absolute; left: 27px; top: 8px; bottom: 8px; width: 1px; background: var(--offwhite3); }
    .p-step { display: grid; grid-template-columns: 56px 1fr; gap: 22px; margin-bottom: 34px; position: relative; }
    .p-step:last-child { margin-bottom: 0; }
    .p-num {
      width: 56px; height: 56px; border-radius: 50%; background: var(--navy); color: var(--gold3);
      display: flex; align-items: center; justify-content: center; font-family: var(--font-display);
      font-size: 22px; z-index: 1; border: 3px solid var(--offwhite);
    }
    .p-step h3 { font-size: 19px; color: var(--navy3); margin-bottom: 6px; font-family: var(--font-body); font-weight: 700; }
    .p-step p { font-size: 14.5px; color: var(--muted); line-height: 1.6; }

    /* ---------- TESTIMONIALS ---------- */
    .testi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .testi-card { background: var(--white); border: 1px solid var(--offwhite3); border-radius: 16px; padding: 26px; }
    .stars { color: var(--gold); font-size: 14px; letter-spacing: 2px; margin-bottom: 12px; }
    .testi-card p.quote { font-family: var(--font-display); font-style: italic; font-size: 18px; color: var(--navy3); line-height: 1.5; margin-bottom: 16px; }
    .testi-card .who { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .testi-card .who b { display: block; color: var(--ink); font-size: 13.5px; font-family: var(--font-body); text-transform: none; letter-spacing: 0; margin-bottom: 2px; }

    /* ---------- BIO ---------- */
    .bio { display: grid; grid-template-columns: 0.75fr 1.25fr; gap: 3rem; align-items: center; background: var(--white); border: 1px solid var(--offwhite3); border-radius: 22px; padding: 3rem; }
    .bio-photo {
      border-radius: 18px; overflow: hidden; position: relative;
      background: radial-gradient(ellipse at 60% 20%, var(--navy2), var(--navy3) 75%);
    }
    .bio-photo img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
    .bio-chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .bio-chips span { font-family: var(--font-mono); font-size: 11.5px; padding: 7px 14px; border-radius: 100px; background: var(--offwhite2); color: var(--navy3); border: 1px solid var(--offwhite3); }
    .bio h2 { font-size: 29px; color: var(--navy3); margin-bottom: 14px; }
    .bio p { font-size: 15px; color: var(--muted); line-height: 1.7; margin-bottom: 10px; }
    .bio blockquote { font-family: var(--font-display); font-style: italic; font-size: 18px; color: var(--navy2); border-left: 2px solid var(--gold); padding-left: 16px; margin-top: 18px; }

    /* ---------- FAQ ---------- */
    .faq { max-width: 720px; margin: 0 auto; }
    .faq details {
      border-bottom: 1px solid var(--offwhite3); padding: 20px 4px;
    }
    .faq summary {
      cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center;
      font-size: 16px; font-weight: 600; color: var(--navy3); gap: 20px;
    }
    .faq summary::-webkit-details-marker { display: none; }
    .faq summary .plus { font-size: 20px; color: var(--gold); transition: transform .25s var(--ease); flex-shrink: 0; }
    .faq details[open] summary .plus { transform: rotate(45deg); }
    .faq p.a { font-size: 14.5px; color: var(--muted); line-height: 1.65; margin-top: 12px; padding-right: 30px; }

    /* ---------- FINAL CTA ---------- */
    .final-cta {
      background: radial-gradient(ellipse 100% 100% at 50% 0%, var(--navy2), var(--navy4));
      color: var(--white); border-radius: 24px; padding: 3.5rem 2rem; text-align: center; position: relative; overflow: hidden;
      border: 1px solid rgba(203,169,86,0.35);
    }
    .final-cta h2 { font-size: 32px; color: var(--white); margin-bottom: 12px; }
    .final-cta h2 em { color: var(--gold3); font-style: italic; }
    .final-cta p { color: rgba(255,255,255,0.75); font-size: 15px; margin-bottom: 26px; }
    .final-actions { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }

    .whatsapp-btn {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--white); color: var(--navy3); padding: 14px 26px; border-radius: 10px;
      text-decoration: none; font-weight: 700; font-size: 14.5px;
      border: 1px solid rgba(255,255,255,0.5);
      transition: transform .25s var(--ease), box-shadow .25s var(--ease), background .2s;
    }
    .whatsapp-btn:hover { transform: translateY(-2px); box-shadow: 0 16px 30px -12px rgba(0,0,0,0.4); background: var(--offwhite); }
    .whatsapp-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    .footer-whatsapp {
      display: inline-flex; align-items: center; gap: 8px;
      background: #25D366; color: #fff; padding: 10px 20px; border-radius: 100px;
      text-decoration: none; font-weight: 600; font-size: 13px;
      transition: transform .2s, box-shadow .2s;
    }
    .footer-whatsapp:hover { transform: translateY(-1px); box-shadow: 0 10px 20px -8px rgba(37,211,102,0.55); }
    .footer-whatsapp svg { width: 16px; height: 16px; }

    /* ---------- FOOTER ---------- */
    footer { padding: 2.8rem 0 2.6rem; text-align: center; border-top: 1px solid var(--offwhite3); }
    footer .footer-row { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    footer p { font-size: 13px; color: var(--muted); }
    footer a.mainsite { color: var(--navy2); text-decoration: underline; text-underline-offset: 3px; }

    .ref-error { text-align: center; padding: 6rem 1.5rem; color: var(--muted); font-family: var(--font-display); }
    .ref-error h1 { font-size: 30px; color: var(--navy3); margin-bottom: 10px; }

    @media (max-width: 860px) {
      .hero-grid { grid-template-columns: 1fr; }
      .hero-photo-col { order: -1; padding-top: 1.5rem; }
      .hero-photo-wrap img { max-height: 340px; }
      .hero-copy { padding-bottom: 2rem; }
      .hero-copy h1 { font-size: 34px; }
      .seal { left: 4px; bottom: 20px; width: 104px; height: 104px; }
      .ref-steps { grid-template-columns: 1fr; gap: 26px; }
      .ref-steps::before { display: none; }
      .trust-grid { grid-template-columns: repeat(2, 1fr); gap: 26px; }
      .compare-row { font-size: 13px; padding: 14px 16px; }
      .services-grid { grid-template-columns: 1fr; }
      .testi-grid { grid-template-columns: 1fr; }
      .bio { grid-template-columns: 1fr; padding: 2rem; }
      .bio-photo { max-width: 240px; margin: 0 auto; aspect-ratio: 1/1; }
    }
  </style>
</head>
<body>

  <div id="ref-content">
    <div class="ref-error"><h1>Loading…</h1></div>
  </div>

    function initInteractions() {
      // Sticky nav shadow/blur on scroll
      const nav = document.getElementById('siteNav');
      if (nav) {
        window.addEventListener('scroll', () => {
          nav.classList.toggle('scrolled', window.scrollY > 12);
        }, { passive: true });
      }

      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Scroll-reveal
      const revealEls = document.querySelectorAll('.reveal');
      if (prefersReduced) {
        revealEls.forEach(el => el.classList.add('in'));
      } else if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('in');
              io.unobserve(entry.target);
            }
          });
        }, { threshold: 0.15 });
        revealEls.forEach(el => io.observe(el));
      } else {
        revealEls.forEach(el => el.classList.add('in'));
      }

      // Animated stat counters
      const counters = document.querySelectorAll('[data-count]');
      const animateCounter = (el) => {
        const target = parseInt(el.getAttribute('data-count'), 10) || 0;
        const suffix = el.getAttribute('data-suffix') || '';
        if (prefersReduced) { el.textContent = target + suffix; return; }
        const duration = 1200;
        const start = performance.now();
        function tick(now) {
          const progress = Math.min((now - start) / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          el.textContent = Math.round(eased * target) + suffix;
          if (progress < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      };
      if ('IntersectionObserver' in window) {
        const cio = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              animateCounter(entry.target);
              cio.unobserve(entry.target);
            }
          });
        }, { threshold: 0.5 });
        counters.forEach(el => cio.observe(el));
      } else {
        counters.forEach(animateCounter);
      }
    }

      renderPartner(partner);

      sb.from('referral_events').insert({
